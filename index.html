<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הזמנה לבת מצווה של מעיין חוטר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f3ea;
    --cream-2:#f1ece0;
    --ink:#1c4b44;
    --ink-soft:#3a655d;
    --gold:#b8934f;
    --gold-soft:#d8c9a3;
    --sage:#cfdccb;
    --white:#fffdf8;
    --error:#a1462f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Heebo',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .invite-frame{
    width:100%;
    border-radius:14px;
    display:block;
    margin:0 auto;
  }
  .invite-wrap{
    position:relative;
    padding:6px;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:36px 0 30px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  }
  .divider span{
    font-family:'Frank Ruhl Libre', serif;
    font-size:15px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .rsvp-card{
    background:var(--white);
    border:1px solid var(--sage);
    border-radius:18px;
    padding:32px 26px;
  }
  .rsvp-title{
    font-family:'Frank Ruhl Libre', serif;
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
    color:var(--ink);
  }
  .rsvp-sub{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:0 0 26px;
    line-height:1.6;
  }
  form{display:flex; flex-direction:column; gap:20px;}
  .field label{
    display:block;
    font-size:13.5px;
    color:var(--ink-soft);
    margin-bottom:7px;
    font-weight:500;
  }
  .field input[type="text"], .field input[type="tel"], .field textarea{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--sage);
    background:transparent;
    padding:9px 2px;
    font-family:'Heebo',sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus, .field textarea:focus{
    border-bottom-color:var(--gold);
  }
  .field textarea{resize:vertical; min-height:56px;}

  .choice-group{
    display:flex;
    gap:10px;
  }
  .choice-group input[type="radio"]{
    position:absolute;
    opacity:0;
    width:0; height:0;
  }
  .choice-group label{
    flex:1;
    text-align:center;
    padding:12px 8px;
    border-radius:12px;
    border:1.5px solid var(--sage);
    font-size:15px;
    font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    margin:0;
  }
  .choice-group input[type="radio"]:checked + label{
    background:var(--sage);
    border-color:var(--ink);
    color:var(--ink);
  }

  .guests-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1.5px solid var(--sage);
    padding:6px 2px;
  }
  .guests-row label{
    font-size:13.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .stepper button{
    width:30px; height:30px;
    border-radius:14px;
    border:1.5px solid var(--gold);
    background:var(--white);
    color:var(--gold);
    font-size:17px;
    line-height:1;
    cursor:pointer;
  }
  .stepper span{
    font-size:17px;
    min-width:18px;
    text-align:center;
    font-weight:600;
  }

  .submit-btn{
    margin-top:6px;
    background:var(--ink);
    color:var(--cream);
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-family:'Heebo',sans-serif;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .submit-btn:hover{background:var(--ink-soft);}
  .submit-btn:disabled{opacity:.55; cursor:default;}

  .status{
    margin-top:16px;
    font-size:14px;
    text-align:center;
    min-height:20px;
  }
  .status.ok{color:var(--ink);}
  .status.err{color:var(--error);}

  .success-view{
    text-align:center;
    padding:20px 4px 4px;
  }
  .success-view .mark{
    font-family:'Frank Ruhl Libre', serif;
    font-size:40px;
    color:var(--gold);
    display:block;
    margin-bottom:10px;
  }
  .success-view h3{
    margin:0 0 8px;
    font-family:'Frank Ruhl Libre', serif;
    font-size:22px;
  }
  .success-view p{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.6;
    margin:0;
  }
  .hidden{display:none !important;}

  footer{
    text-align:center;
    margin-top:26px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>
<div class="page">

  <div class="invite-wrap">
    <img class="invite-frame" src="invitation.jpg" alt="הזמנה לבת המצווה של מעיין">
  </div>

  <div class="divider"><span>אישור הגעה</span></div>

  <div class="rsvp-card" id="cardArea">

    <div id="formView">
      <h2 class="rsvp-title">נשמח לדעת שתגיעו</h2>
      <p class="rsvp-sub">מלאו את הפרטים ונדע לשריין לכם מקום. ניתן לעדכן גם עבור בני משפחה נוספים.</p>

      <form id="rsvpForm">
        <div class="field">
          <label for="name">שם מלא</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div class="field">
          <label>האם תגיעו?</label>
          <div class="choice-group">
            <input type="radio" id="att_yes" name="attending" value="מגיעים" checked>
            <label for="att_yes">מגיעים בשמחה</label>
            <input type="radio" id="att_no" name="attending" value="לא מגיעים">
            <label for="att_no">לא נוכל להגיע</label>
          </div>
        </div>

        <div class="guests-row" id="guestsRow">
          <label>מספר מגיעים (כולל אתכם)</label>
          <div class="stepper">
            <button type="button" id="minusBtn" aria-label="הפחת">−</button>
            <span id="guestsCount">1</span>
            <button type="button" id="plusBtn" aria-label="הוסף">+</button>
          </div>
        </div>
        <input type="hidden" id="guests" name="guests" value="1">

        <div class="field">
          <label for="phone">טלפון ליצירת קשר (לא חובה)</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="050-0000000">
        </div>

        <div class="field">
          <label for="note">הודעה קצרה לזוג (לא חובה)</label>
          <textarea id="note" name="note" rows="2"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">שליחת אישור הגעה</button>
        <div class="status" id="statusMsg"></div>
      </form>
    </div>

    <div id="successView" class="success-view hidden">
      <span class="mark">✦</span>
      <h3>תודה!</h3>
      <p>אישור ההגעה נקלט בהצלחה. מחכים לראותכם באירוע.</p>
    </div>

  </div>

  <footer>שאלות? ניתן לפנות ל־ avitalhoter@gmail.com או 054-8192813</footer>

</div>

<script>
  // *** יש להחליף את הכתובת הזו בכתובת ה-Web App שתקבלו לאחר פריסת ה-Google Apps Script ***
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-G394HtWzsjUrY-SKNjHHoRJm--oFThbqcjKPsnnXDMenBxzAcawLRJSXoJeo03SE/exec";

  const guestsRow = document.getElementById('guestsRow');
  const guestsCount = document.getElementById('guestsCount');
  const guestsHidden = document.getElementById('guests');
  const minusBtn = document.getElementById('minusBtn');
  const plusBtn = document.getElementById('plusBtn');
  let guests = 1;

  function renderGuests(){
    guestsCount.textContent = guests;
    guestsHidden.value = guests;
  }
  minusBtn.addEventListener('click', () => { if(guests>1){ guests--; renderGuests(); }});
  plusBtn.addEventListener('click', () => { if(guests<20){ guests++; renderGuests(); }});

  document.querySelectorAll('input[name="attending"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      guestsRow.style.opacity = (r.value === "מגיעים" && r.checked) ? "1" : ".35";
    });
  });

  const form = document.getElementById('rsvpForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    statusMsg.textContent = "";
    statusMsg.className = "status";

    if(SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
      statusMsg.textContent = "יש לחבר קודם את כתובת ה-Apps Script בקוד (SCRIPT_URL).";
      statusMsg.className = "status err";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "שולח...";

    const data = new FormData(form);
    const params = new URLSearchParams();
    for(const [k,v] of data.entries()) params.append(k, v);
    params.append('timestamp', new Date().toISOString());

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: params
    })
    .then(res => res.json())
    .then(json => {
      if(json && json.result === 'success'){
        document.getElementById('formView').classList.add('hidden');
        document.getElementById('successView').classList.remove('hidden');
      } else {
        throw new Error('bad response');
      }
    })
    .catch(err => {
      statusMsg.textContent = "אירעה שגיאה בשליחה, נסו שוב.";
      statusMsg.className = "status err";
      submitBtn.disabled = false;
      submitBtn.textContent = "שליחת אישור הגעה";
    });
  });

  renderGuests();
</script>
</body>
</html>
